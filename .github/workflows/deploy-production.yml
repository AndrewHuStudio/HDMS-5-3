name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}

    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            PRODUCTION_HOST \
            PRODUCTION_PORT \
            PRODUCTION_USER \
            PRODUCTION_SSH_KEY \
            PRODUCTION_KNOWN_HOSTS
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production_key"
          chmod 600 "$HOME/.ssh/production_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read production base revision
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(
            ssh \
              -i "$HOME/.ssh/production_key" \
              -p "$PRODUCTION_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "$PRODUCTION_USER@$PRODUCTION_HOST" \
              'cd /opt/hdms && git rev-parse HEAD'
          )"
          git rev-parse --verify "$base_sha^{commit}"
          if ! git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"; then
            echo "Production revision is not an ancestor of the pushed revision." >&2
            exit 1
          fi
          echo "PRODUCTION_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Build verified deployment bundle
        if: env.PRODUCTION_BASE_SHA != github.sha
        shell: bash
        run: |
          set -euo pipefail
          bundle_ref="refs/heads/production-deploy"
          trap 'git update-ref -d "$bundle_ref"' EXIT
          git update-ref "$bundle_ref" "$GITHUB_SHA"
          git bundle create production.bundle \
            "$bundle_ref" "^$PRODUCTION_BASE_SHA"
          git bundle verify production.bundle

      - name: Deploy pushed main revision
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="/opt/hdms/.deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          if [ "$PRODUCTION_BASE_SHA" != "$GITHUB_SHA" ]; then
            scp \
              -i "$HOME/.ssh/production_key" \
              -P "$PRODUCTION_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              production.bundle \
              "${PRODUCTION_USER}@${PRODUCTION_HOST}:$bundle_path"
          fi
          ssh \
            -i "$HOME/.ssh/production_key" \
            -p "$PRODUCTION_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            bash -s -- \
              "$GITHUB_SHA" "$PRODUCTION_BASE_SHA" "$bundle_path" <<'REMOTE'
          set -euo pipefail

          expected_sha="$1"
          base_sha="$2"
          bundle_path="$3"
          trap 'rm -f -- "$bundle_path"' EXIT
          cd /opt/hdms

          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Production checkout is not on main; refusing deployment." >&2
            exit 1
          fi

          tracked_changes="$(git status --porcelain --untracked-files=no)"
          if [ -n "$tracked_changes" ]; then
            echo "Production checkout has tracked modifications; refusing deployment." >&2
            printf '%s\n' "$tracked_changes" >&2
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$expected_sha" ]; then
            if [ "$current_sha" != "$base_sha" ]; then
              echo "Production revision changed while preparing deployment." >&2
              exit 1
            fi
            if [ ! -f "$bundle_path" ]; then
              echo "Deployment bundle is missing; refusing deployment." >&2
              exit 1
            fi

            git fetch "$bundle_path" \
              refs/heads/production-deploy:refs/remotes/origin/main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$expected_sha" ]; then
              echo "origin/main does not match the pushed revision; refusing deployment." >&2
              exit 1
            fi

            git merge --ff-only origin/main
          fi
          deployed_sha="$(git rev-parse HEAD)"
          if [ "$deployed_sha" != "$expected_sha" ]; then
            echo "Production checkout did not reach the pushed revision." >&2
            exit 1
          fi

          compose() {
            docker compose --env-file .env.production -f docker-compose.production.yml "$@"
          }

          compose up -d --build --remove-orphans
          compose restart nginx

          deadline=$((SECONDS + 180))
          while true; do
            all_ready=1
            for service in $(compose config --services); do
              container_id="$(compose ps -q "$service")"
              if [ -z "$container_id" ]; then
                all_ready=0
                continue
              fi

              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [ "$state" != "running" ] || [ "$health" = "starting" ] || [ "$health" = "unhealthy" ]; then
                all_ready=0
              fi
            done

            if [ "$all_ready" -eq 1 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              compose ps
              echo "Production services did not become ready before timeout." >&2
              exit 1
            fi
            sleep 5
          done

          compose ps
          REMOTE
