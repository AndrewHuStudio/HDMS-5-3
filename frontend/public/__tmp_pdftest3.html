<!doctype html><html><body><pre id="out">start</pre>
<script src="/__tmp_pdf_api.js"></script>
<script>
const out=document.getElementById('out');
const log=m=>{out.textContent+="\n"+m;document.title=out.textContent.replace(/\n/g,' | ');};
const wt=(p,ms,tag)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(tag+"_TIMEOUT")),ms))]);
(async()=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc="/pdf.worker.min.js";
  // 1) real worker readiness
  try{const w=new pdfjsLib.PDFWorker({name:"probe"});await wt(w.promise,10000,"WORKER_READY");log("WORKER_READY=OK port="+!!w.port);}
  catch(e){log("WORKER_READY=FAIL "+e.message);}
  // 2) fake worker (main-thread) document load of static pdf
  try{
    const d=await wt(pdfjsLib.getDocument({url:"/__tmp_static.pdf",disableWorker:true}).promise,15000,"FAKE");
    log("FAKEWORKER_STATIC=OK pages="+d.numPages);
  }catch(e){log("FAKEWORKER_STATIC=FAIL "+e.message);}
  log("DONE");
})();
</script></body></html>
