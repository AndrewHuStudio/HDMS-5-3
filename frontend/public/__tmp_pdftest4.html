<!doctype html><html><body><pre id="out">start</pre>
<script src="/__tmp_pdf_api.js"></script>
<script>
const lines=[];
const log=m=>{lines.push(m);document.getElementById('out').textContent=lines.join("\n");
  fetch("http://127.0.0.1:8799/log",{method:"POST",body:m,mode:"cors"}).catch(()=>{});};
const wt=(p,ms,tag)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(tag+"_TIMEOUT")),ms))]);
(async()=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc="/pdf.worker.min.js";
  log("api="+pdfjsLib.version);
  const u=new URLSearchParams(location.search).get("u");
  try{const d=await wt(pdfjsLib.getDocument({url:"/__tmp_static.pdf"}).promise,20000,"A");log("A_STATIC=OK pages="+d.numPages);}catch(e){log("A_STATIC=FAIL "+e.message);}
  try{const d=await wt(pdfjsLib.getDocument({url:u}).promise,20000,"D");log("D_PROXY=OK pages="+d.numPages);}catch(e){log("D_PROXY=FAIL "+e.message);}
  log("DONE");
})();
</script></body></html>
