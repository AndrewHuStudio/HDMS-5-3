<!doctype html><html><body><pre id="out">start</pre>
<script>
const out=document.getElementById('out');
const log=m=>{out.textContent+="\n"+m;document.title=out.textContent.replace(/\n/g,' | ');};
const w=new Worker("/__tmp_worker_echo.js");
w.onmessage=e=>log("GOT "+e.data);
w.onerror=e=>log("ERR "+e.message);
w.postMessage("hi");
setTimeout(()=>log("END"),6000);
</script></body></html>
