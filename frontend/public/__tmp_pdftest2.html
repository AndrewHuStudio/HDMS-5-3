<!doctype html><html><body><pre id="out">start</pre>
<script src="/__tmp_pdf_api.js"></script>
<script>
const out=document.getElementById('out');
const log=m=>{out.textContent+="\n"+m;document.title=out.textContent.replace(/\n/g,' | ');};
const withTimeout=(p,ms,tag)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(tag+"_TIMEOUT")),ms))]);
(async()=>{
  pdfjsLib.GlobalWorkerOptions.workerSrc="/pdf.worker.min.js";
  // A: static public pdf via url
  try{const d=await withTimeout(pdfjsLib.getDocument({url:"/__tmp_static.pdf"}).promise,12000,"A");log("A_STATIC_URL=OK pages="+d.numPages);}
  catch(e){log("A_STATIC_URL=FAIL "+e.message);}
  // B: proxy pdf via ArrayBuffer (bypass pdfjs range transport)
  try{
    const u=new URLSearchParams(location.search).get("u");
    const buf=await (await fetch(u)).arrayBuffer();
    log("B_bytes="+buf.byteLength);
    const d=await withTimeout(pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,12000,"B");
    log("B_PROXY_DATA=OK pages="+d.numPages);
  }catch(e){log("B_PROXY_DATA=FAIL "+e.message);}
  // C: proxy pdf via url with ranges disabled
  try{
    const u=new URLSearchParams(location.search).get("u");
    const d=await withTimeout(pdfjsLib.getDocument({url:u,disableRange:true,disableStream:true}).promise,12000,"C");
    log("C_PROXY_NORANGE=OK pages="+d.numPages);
  }catch(e){log("C_PROXY_NORANGE=FAIL "+e.message);}
  // D: proxy pdf via url default (the failing path)
  try{
    const u=new URLSearchParams(location.search).get("u");
    const d=await withTimeout(pdfjsLib.getDocument({url:u}).promise,12000,"D");
    log("D_PROXY_URL=OK pages="+d.numPages);
  }catch(e){log("D_PROXY_URL=FAIL "+e.message);}
  log("DONE");
})();
</script></body></html>
