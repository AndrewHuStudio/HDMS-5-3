<!doctype html><html><body><pre id="out">start</pre>
<script src="/__tmp_pdf_api.js"></script>
<script>
const out = document.getElementById('out');
const log = m => { out.textContent += "\n" + m; document.title = out.textContent.replace(/\n/g,' | '); };
window.addEventListener('error', e => log("WINDOW_ERROR " + e.message));
window.addEventListener('unhandledrejection', e => log("UNHANDLED " + (e.reason && e.reason.message)));
(async () => {
  try {
    log("apiVersion=" + (window.pdfjsLib && pdfjsLib.version));
    pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdf.worker.min.js";
    // Probe worker boot independently
    try {
      const w = new Worker("/pdf.worker.min.js");
      w.onerror = ev => log("WORKER_ONERROR " + ev.message);
      log("worker constructed");
    } catch (e) { log("WORKER_CTOR_FAIL " + e.message); }

    const url = new URLSearchParams(location.search).get("u");
    log("fetch probe...");
    const res = await fetch(url, {headers:{Range:"bytes=0-1023"}});
    log("fetch status=" + res.status + " len=" + res.headers.get("content-length") + " type=" + res.headers.get("content-type"));

    log("getDocument...");
    const task = pdfjsLib.getDocument({ url });
    task.onProgress = p => log("progress " + p.loaded + "/" + p.total);
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("TIMEOUT_15s")), 15000));
    const doc = await Promise.race([task.promise, timeout]);
    log("PAGES=" + doc.numPages);
    log("RESULT=OK");
  } catch (e) {
    log("RESULT=FAIL name=" + e.name + " msg=" + e.message);
  }
})();
</script></body></html>
