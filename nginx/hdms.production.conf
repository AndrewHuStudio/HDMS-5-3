server {
    listen 80;
    listen [::]:80;
    server_name hdmsurban.com www.hdmsurban.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hdmsurban.com www.hdmsurban.com;

    ssl_certificate /etc/letsencrypt/live/hdmsurban.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hdmsurban.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 512m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /qa/chat/stream {
        proxy_pass http://qa:8002;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /qa/ { proxy_pass http://qa:8002; }
    location /rag/ { proxy_pass http://qa:8002; }
    location /api/rag/ {
        rewrite ^/api(/rag/.*)$ $1 break;
        proxy_pass http://qa:8002;
    }

    location /ingestion/ {
        proxy_pass http://data_process:8004;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /graph/ {
        proxy_pass http://data_process:8004;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /health/db { proxy_pass http://data_process:8004; }
    location /api/ {
        proxy_pass http://data_process:8004;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /approval/ { proxy_pass http://approval:8005; }
    location /api/approval/ { proxy_pass http://approval:8005/; }

    location ~ ^/(models|height-check|setback-check|setback-rate-check|setback-rate|sight-corridor|fire-ladder|sky-bridge|green-setback-check|green-setback|plaza-setback-check|plaza-setback|vehicle-entrance-check|vehicle-entrance|pedestrian-entrance-check|pedestrian-entrance)(/|$) {
        proxy_pass http://review:8003;
    }

    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
