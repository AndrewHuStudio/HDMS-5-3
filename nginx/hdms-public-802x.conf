worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream hdms_frontend {
        server 127.0.0.1:8021;
    }

    upstream hdms_review {
        server 127.0.0.1:8023;
    }

    upstream hdms_qa {
        server 127.0.0.1:8022;
    }

    upstream hdms_data {
        server 127.0.0.1:8025;
    }

    upstream hdms_approval {
        server 127.0.0.1:8024;
    }

    server {
        listen 80;
        server_name hdmsurban.com www.hdmsurban.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hdmsurban.com www.hdmsurban.com;

        ssl_certificate /etc/letsencrypt/live/hdmsurban.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hdmsurban.com/privkey.pem;

        client_max_body_size 512m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /qa/chat/stream {
            proxy_pass http://hdms_qa;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 300s;
        }

        location /qa/ {
            proxy_pass http://hdms_qa;
        }

        location /rag/ {
            proxy_pass http://hdms_qa;
        }

        location /ingestion/ {
            proxy_pass http://hdms_data;
        }

        location /graph/ {
            proxy_pass http://hdms_data;
        }

        location /approval/ {
            proxy_pass http://hdms_approval;
        }

        location ~ ^/(models|height-check|setback-check|sight-corridor|fire-ladder|sky-bridge)(/|$) {
            proxy_pass http://hdms_review;
        }

        location /_next/ {
            proxy_pass http://hdms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://hdms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
