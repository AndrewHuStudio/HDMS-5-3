# Copy this file to %USERPROFILE%\\.cloudflared\\config.yml and replace placeholders.
# Tunnel name used below: hdms-external

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: C:\\Users\\YOUR_WINDOWS_USER\\.cloudflared\\REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: hdmsurban.com
    path: ^/qa/chat/stream$
    service: http://localhost:8022

  - hostname: hdmsurban.com
    path: ^/qa/.*$
    service: http://localhost:8022

  - hostname: hdmsurban.com
    path: ^/rag/.*$
    service: http://localhost:8022

  - hostname: hdmsurban.com
    path: ^/ingestion/.*$
    service: http://localhost:8025

  - hostname: hdmsurban.com
    path: ^/graph/.*$
    service: http://localhost:8025

  - hostname: hdmsurban.com
    path: ^/approval/.*$
    service: http://localhost:8024

  - hostname: hdmsurban.com
    path: ^/(models|height-check|setback-check|sight-corridor|fire-ladder|sky-bridge)(/.*)?$
    service: http://localhost:8023

  - hostname: hdmsurban.com
    service: http://localhost:8021

  - hostname: www.hdmsurban.com
    service: http://localhost:8021

  - service: http_status:404
